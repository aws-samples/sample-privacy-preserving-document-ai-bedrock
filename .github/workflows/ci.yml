name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden internal references
        run: bash scripts/check-sanitized.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.3" pytest
          pip install -r src/orchestrator/requirements.txt
          pip install -r src/pii-service/requirements.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -q

  cdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Synthesize CDK
        working-directory: deploy/cdk
        run: |
          npm install
          npx cdk synth
