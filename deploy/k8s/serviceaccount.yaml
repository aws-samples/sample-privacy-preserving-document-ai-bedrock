# Shared service account for all three Deployments' AWS access (DynamoDB,
# Bedrock invoke_model/apply_guardrail — the same permissions as deploy/cdk's
# AppPolicy). The annotation below is EKS IRSA's convention; on a non-EKS
# cluster, remove it and inject credentials another way (env vars, a mounted
# Secret, an instance profile on the node) instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID_PLACEHOLDER:role/ROLE_NAME_PLACEHOLDER"
